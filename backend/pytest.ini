[pytest]
# Pytest configuration for Hydros backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Imports resolve against the backend root so `pytest` works the same as
# `python -m pytest` (which only works because it injects the CWD).
pythonpath = .

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-branch
    --asyncio-mode=auto

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    slow: Tests that take longer to run
    mqtt: Tests requiring MQTT broker
    modbus: Tests requiring Modbus server
