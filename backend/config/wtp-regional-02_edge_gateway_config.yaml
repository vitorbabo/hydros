mqtt:
  client_id: edge-gateway-wtp-regional-02
  host: ${MQTT_HOST:localhost}
  port: ${MQTT_PORT:1883}
plcs:
- connection_id: main_plc
  enabled: true
  ip_address: ${MAIN_PLC_HOST:192.168.1.100}
  port: ${MAIN_PLC_PORT:502}
  protocol: modbus_tcp
  unit_id: 1
- connection_id: chemical_plc
  enabled: true
  ip_address: ${CHEM_PLC_HOST:192.168.1.101}
  port: ${CHEM_PLC_PORT:502}
