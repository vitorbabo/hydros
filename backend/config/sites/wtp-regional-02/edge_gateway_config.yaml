mqtt:
  client_id: edge-gateway-wtp-regional-02
  host: ${MQTT_HOST:localhost}
  port: ${MQTT_PORT:1883}
plcs:
- connection_id: main_plc
  enabled: true
  ip_address: ${MAIN_PLC_HOST:localhost}
  port: ${MAIN_PLC_PORT:5020}
  protocol: modbus_tcp
  unit_id: 1
- connection_id: chemical_plc
  enabled: true
  ip_address: ${CHEM_PLC_HOST:localhost}
  port: ${CHEM_PLC_PORT:5020}
  protocol: modbus_tcp
  unit_id: 1
- connection_id: filtration_plc
  enabled: true
  ip_address: ${FILT_PLC_HOST:localhost}
  port: ${FILT_PLC_PORT:502}
  protocol: modbus_tcp
  unit_id: 1
- connection_id: distribution_plc
  enabled: true
  ip_address: ${DIST_PLC_HOST:localhost}
  protocol: s7
  rack: ${S7_RACK:0}
  slot: ${S7_SLOT:1}
- connection_id: advanced_monitoring
  enabled: true
  endpoint_url: ${OPCUA_ENDPOINT:opc.tcp://localhost:4840}
  protocol: opcua
site_id: wtp-regional-02
