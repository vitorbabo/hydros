# Docker Compose override for development
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  hydros-system:
    build:
      context: ./hydros
      dockerfile: Dockerfile
    environment:
      - MODE=simulation  # Run in simulation mode for development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./hydros:/app:rw  # Mount source code for development
      - ./hydros/config:/app/config:rw
    command: python hydros_system.py --mode simulation --log-level DEBUG
    
  # Development MQTT client for testing
  mqtt-client:
    image: eclipse-mosquitto:2.0
    container_name: hydros-mqtt-client
    depends_on:
      - mosquitto
      - hydros-system
    command: mosquitto_sub -h mosquitto -t "wtp/+/+/+/observation" -v
    networks:
      - hydros
