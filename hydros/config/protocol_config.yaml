# Protocol Configuration
# Configuration for protocol servers and clients

protocol_servers:
  modbus_tcp:
    enabled: true
    host: "0.0.0.0"
    port: 5020
    device_id: 1
    
  opcua:
    enabled: false
    endpoint: "opc.tcp://0.0.0.0:4840/freeopcua/server/"
    
  mqtt:
    enabled: false
    broker_host: "localhost"
    broker_port: 1883
    topic_prefix: "hydros/wtp"

# Protocol client configurations for edge gateway mode
protocol_clients:
  # Example PLC connections
  - plc_id: "primary_plc"
    protocol: "modbus"
    host: "192.168.1.100"
    port: 502
    device_id: 1
    timeout: 5.0
    retry_count: 3
    enabled: true
    
  - plc_id: "secondary_plc"
    protocol: "modbus"
    host: "192.168.1.101"
    port: 502
    device_id: 1
    timeout: 5.0
    retry_count: 3
    enabled: false

# Data collection settings
data_collection:
  read_interval: 2.0  # seconds
  max_retries: 3
  connection_timeout: 5.0
  
# Parameter mappings for edge gateway
parameter_mappings:
  # This section maps plant model parameters to PLC addresses
  # It should be auto-generated by the address allocator
  
# Logging configuration
logging:
  level: "INFO"
  file: "hydros_protocols.log"
