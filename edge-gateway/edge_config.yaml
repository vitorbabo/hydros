# Edge Gateway Configuration
# Production-ready configuration for connecting to real WTP PLCs

# Site identification
site_id: "wtp-porto-01"
site_name: "Porto Municipal Water Treatment Plant"
location:
  latitude: 41.1579
  longitude: -8.6291
  timezone: "Europe/Lisbon"

# MQTT broker configuration
mqtt:
  host: "${MQTT_HOST:localhost}"
  port: "${MQTT_PORT:1883}"
  client_id: "edge-gateway-porto-01"
  username: "${MQTT_USERNAME:}"
  password: "${MQTT_PASSWORD:}"
  keepalive: 60
  clean_session: true
  tls:
    enabled: false
    ca_cert_path: ""
    cert_path: ""
    key_path: ""

# Data publishing configuration
publishing:
  batch_size: 10                # Number of observations to batch
  max_batch_time_ms: 1000       # Max time to wait for batch
  raw_data_topic: "plc/raw"     # Topic for raw PLC data
  qos: 0                        # MQTT QoS level
  retain: false                 # Retain messages

# Data quality and validation
data_quality:
  enable_range_validation: true
  enable_rate_of_change_validation: true
  max_change_rate_per_second: 0.1  # Maximum allowed change rate
  comm_failure_threshold: 3     # Consecutive failures before marking as comm_error
  sensor_timeout_seconds: 30    # Time before marking sensor as timeout

# Store and forward configuration (for network outages)
store_and_forward:
  enabled: true
  max_buffer_size: 10000        # Max observations to buffer
  storage_path: "/data/buffer"   # Path to store buffered data
  flush_on_reconnect: true      # Send buffered data when connection restored

# PLC connections
plcs:
  # Main Plant PLC - connect to simulator Modbus server
  - connection_id: "main_plc"
    protocol: "modbus_tcp"
    ip_address: "${PLC_HOST:localhost}"  # Simulator host
    port: 5020                  # Simulator Modbus port (different from standard 502)
    unit_id: 1
    timeout_ms: 5000
    retry_attempts: 3
    retry_delay_ms: 1000
    enabled: true
    description: "Main plant control PLC (via simulator)"
  
  # Alternative OPC UA connection to simulator
  - connection_id: "opcua_server"
    protocol: "opcua"
    ip_address: "${PLC_HOST:localhost}"
    port: 4840                  # Simulator OPC UA port
    endpoint_url: "opc.tcp://${PLC_HOST:localhost}:4840/hydros/wtp-simulator"
    security_mode: "None"
    username: ""
    password: ""
    timeout_ms: 10000
    enabled: false              # Enable this instead of Modbus for OPC UA testing
    description: "OPC UA connection to simulator"
  
  # Example real PLC connection (disabled by default)
  - connection_id: "real_main_plc"
    protocol: "s7comm"          # Real Siemens PLC
    ip_address: "192.168.1.10"
    port: 102
    rack: 0
    slot: 1
    timeout_ms: 5000
    retry_attempts: 3
    enabled: false              # Enable for real PLC connection
    description: "Real plant control PLC (S7-1500)"

# Tag mappings - connects PLC addresses to standardized data model
tags:
  # Raw Water Intake System (Modbus addresses)
  - tag_address: "40100"        # Modbus holding register 40100 (maps to DB1.DBW100)
    plc_connection: "main_plc"
    asset_id: "raw_intake"
    sensor_id: "level-raw-intake"
    measurement: "level"
    unit: "m"
    data_type: "REAL"
    scale_factor: 0.01          # Convert from cm to m
    offset: 0.0
    min_value: 0.0
    max_value: 5.0
    sample_rate_ms: 2000
    description: "Raw water intake basin level"
    component_type: "intake"
  
  - tag_address: "40102"        # Modbus holding register 40102
    plc_connection: "main_plc"
    asset_id: "raw_intake"
    sensor_id: "flow-raw-intake"
    measurement: "flow_rate"
    unit: "m3/h"
    data_type: "REAL"
    scale_factor: 1.0
    offset: 0.0
    min_value: 0.0
    max_value: 100.0
    sample_rate_ms: 1000
    description: "Raw water intake flow rate"
    component_type: "intake"
  
  - tag_address: "40104"        # Modbus holding register 40104
    plc_connection: "main_plc"
    asset_id: "raw_intake"
    sensor_id: "turbidity-raw-intake"
    measurement: "turbidity"
    unit: "NTU"
    data_type: "REAL"
    scale_factor: 1.0
    offset: 0.0
    min_value: 0.0
    max_value: 100.0
    sample_rate_ms: 5000
    description: "Raw water turbidity"
    component_type: "intake"
  
  - tag_address: "40106"        # Modbus holding register 40106
    plc_connection: "main_plc"
    asset_id: "raw_intake"
    sensor_id: "ph-raw-intake"
    measurement: "ph"
    unit: "pH"
    data_type: "REAL"
    scale_factor: 0.01          # pH often stored as integer * 100
    offset: 0.0
    min_value: 4.0
    max_value: 12.0
    sample_rate_ms: 10000
    description: "Raw water pH"
    component_type: "intake"
  
  # Intake Pump 1 (Modbus addresses)
  - tag_address: "40200"        # Modbus holding register 40200 (maps to DB2.DBW100)
    plc_connection: "main_plc"
    asset_id: "intake_pump_1"
    sensor_id: "flow-intake-pump-1"
    measurement: "flow_rate"
    unit: "m3/h"
    data_type: "REAL"
    scale_factor: 1.0
    offset: 0.0
    min_value: 0.0
    max_value: 50.0
    sample_rate_ms: 1000
    description: "Intake pump 1 flow rate"
    component_type: "pump"
  
  - tag_address: "40202"        # Modbus holding register 40202
    plc_connection: "main_plc"
    asset_id: "intake_pump_1"
    sensor_id: "pressure-intake-pump-1"
    measurement: "pressure"
    unit: "bar"
    data_type: "REAL"
    scale_factor: 0.01          # Convert from cbar to bar
    offset: 0.0
    min_value: 0.0
    max_value: 10.0
    sample_rate_ms: 1000
    description: "Intake pump 1 discharge pressure"
    component_type: "pump"
  
  - tag_address: "40204"        # Modbus holding register 40204
    plc_connection: "main_plc"
    asset_id: "intake_pump_1"
    sensor_id: "current-intake-pump-1"
    measurement: "motor_current"
    unit: "A"
    data_type: "REAL"
    scale_factor: 0.1           # Convert from dA to A
    offset: 0.0
    min_value: 0.0
    max_value: 50.0
    sample_rate_ms: 2000
    description: "Intake pump 1 motor current"
    component_type: "pump"
  
  - tag_address: "40206"        # Modbus holding register 40206
    plc_connection: "main_plc"
    asset_id: "intake_pump_1"
    sensor_id: "temperature-intake-pump-1"
    measurement: "motor_temperature"
    unit: "°C"
    data_type: "INT16"
    scale_factor: 1.0
    offset: 0.0
    min_value: 0.0
    max_value: 150.0
    sample_rate_ms: 5000
    description: "Intake pump 1 motor temperature"
    component_type: "pump"
  
  - tag_address: "40208"        # Modbus holding register 40208
    plc_connection: "main_plc"
    asset_id: "intake_pump_1"
    sensor_id: "vibration-intake-pump-1"
    measurement: "vibration"
    unit: "mm/s"
    data_type: "REAL"
    scale_factor: 0.01          # Convert from hundredths
    offset: 0.0
    min_value: 0.0
    max_value: 20.0
    sample_rate_ms: 1000
    description: "Intake pump 1 vibration RMS"
    component_type: "pump"
  
  - tag_address: "1100"         # Modbus coil 1100 (maps to DB2.DBX100.0)
    plc_connection: "main_plc"
    asset_id: "intake_pump_1"
    sensor_id: "status-intake-pump-1"
    measurement: "run_status"
    unit: "bool"
    data_type: "BOOL"
    scale_factor: 1.0
    offset: 0.0
    sample_rate_ms: 1000
    description: "Intake pump 1 run status"
    component_type: "pump"
  
  # Chemical Dosing System
  - tag_address: "40300"        # Modbus holding register 40300
    plc_connection: "main_plc"
    asset_id: "coagulant_dosing"
    sensor_id: "level-coagulant-tank"
    measurement: "chemical_tank_level"
    unit: "m"
    data_type: "INT16"
    scale_factor: 0.001         # Convert from mm to m
    offset: 0.0
    min_value: 0.0
    max_value: 3.0
    sample_rate_ms: 10000
    description: "Coagulant tank level"
    component_type: "chemical_dosing"
  
  - tag_address: "40302"        # Modbus holding register 40302
    plc_connection: "main_plc"
    asset_id: "coagulant_dosing"
    sensor_id: "dose-rate-coagulant"
    measurement: "chemical_dose_rate"
    unit: "mg/L"
    data_type: "INT16"
    scale_factor: 0.1           # Convert from tenths
    offset: 0.0
    min_value: 0.0
    max_value: 50.0
    sample_rate_ms: 2000
    description: "Coagulant dose rate"
    component_type: "chemical_dosing"
  
  # Filter System
  - tag_address: "40600"        # Modbus holding register 40600 (maps to DB6.DBW100)
    plc_connection: "main_plc"
    asset_id: "filter_bed_1"
    sensor_id: "pressure-diff-filter-1"
    measurement: "differential_pressure"
    unit: "mbar"
    data_type: "INT16"
    scale_factor: 1.0
    offset: 0.0
    min_value: 0
    max_value: 500
    sample_rate_ms: 5000
    description: "Filter 1 differential pressure"
    component_type: "filtration"
  
  - tag_address: "40602"        # Modbus holding register 40602
    plc_connection: "main_plc"
    asset_id: "filter_bed_1"
    sensor_id: "turbidity-filter-1-effluent"
    measurement: "turbidity"
    unit: "NTU"
    data_type: "REAL"
    scale_factor: 1.0
    offset: 0.0
    min_value: 0.0
    max_value: 5.0
    sample_rate_ms: 2000
    description: "Filter 1 effluent turbidity"
    component_type: "filtration"
  
  # Chlorination System
  - tag_address: "40700"        # Modbus holding register 40700 (maps to DB7.DBW100)
    plc_connection: "main_plc"
    asset_id: "chlorination"
    sensor_id: "residual-chlorine"
    measurement: "chlorine_residual"
    unit: "mg/L"
    data_type: "REAL"
    scale_factor: 1.0
    offset: 0.0
    min_value: 0.0
    max_value: 10.0
    sample_rate_ms: 5000
    description: "Free chlorine residual"
    component_type: "disinfection"
  
  # Finished Water Storage
  - tag_address: "40900"        # Modbus holding register 40900 (maps to DB9.DBW100)
    plc_connection: "main_plc"
    asset_id: "finished_water_tank"
    sensor_id: "level-finished-water"
    measurement: "level"
    unit: "m"
    data_type: "REAL"
    scale_factor: 0.01
    offset: 0.0
    min_value: 0.0
    max_value: 10.0
    sample_rate_ms: 5000
    description: "Finished water tank level"
    component_type: "storage"

# Alarm and event configuration
alarms:
  enabled: true
  topic_prefix: "wtp/alarms"
  
  # Define alarm conditions
  definitions:
    - name: "high_turbidity"
      asset_id: "raw_intake"
      sensor_id: "turbidity-raw-intake"
      condition: "value > 20.0"
      severity: "medium"
      message: "Raw water turbidity exceeds 20 NTU"
    
    - name: "low_tank_level"
      asset_id: "finished_water_tank"
      sensor_id: "level-finished-water"
      condition: "value < 1.0"
      severity: "high"
      message: "Finished water tank level critically low"
    
    - name: "pump_overcurrent"
      asset_id: "intake_pump_1"
      sensor_id: "current-intake-pump-1"
      condition: "value > 40.0"
      severity: "high"
      message: "Intake pump 1 overcurrent condition"
    
    - name: "high_vibration"
      asset_id: "intake_pump_1"
      sensor_id: "vibration-intake-pump-1"
      condition: "value > 10.0"
      severity: "medium"
      message: "Intake pump 1 high vibration detected"

# Logging configuration
logging:
  level: "INFO"                 # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file_path: "/var/log/edge-gateway.log"
  max_file_size_mb: 50
  backup_count: 5
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Edge computing capabilities
edge_analytics:
  enabled: true
  
  # Local calculations
  calculations:
    - name: "pump_efficiency"
      inputs: ["flow-intake-pump-1", "pressure-intake-pump-1", "current-intake-pump-1"]
      output_sensor_id: "efficiency-intake-pump-1"
      formula: "flow * pressure / (current * 746)"  # Simplified efficiency calculation
      unit: "%"
      sample_rate_ms: 10000
    
    - name: "specific_energy"
      inputs: ["current-intake-pump-1", "flow-intake-pump-1"]
      output_sensor_id: "energy-specific-intake-pump-1"
      formula: "current * 415 * 1.732 / (1000 * flow)"  # kWh/m3
      unit: "kWh/m3"
      sample_rate_ms: 10000

# Maintenance and diagnostics
maintenance:
  enabled: true
  
  # Predictive maintenance indicators
  predictive_indicators:
    - asset_id: "intake_pump_1"
      parameters: ["vibration", "motor_temperature", "motor_current"]
      algorithm: "trend_analysis"
      alert_threshold: 0.8      # 80% confidence level
    
    - asset_id: "filter_bed_1"
      parameters: ["differential_pressure", "turbidity"]
      algorithm: "filter_performance"
      backwash_threshold: 350   # mbar

# Security configuration
security:
  enable_encryption: false     # Enable for production
  certificate_path: "/etc/ssl/certs/edge-gateway.pem"
  private_key_path: "/etc/ssl/private/edge-gateway.key"
  
  # Network security
  allowed_networks:
    - "192.168.1.0/24"        # Plant network
    - "10.0.0.0/8"            # Corporate network
  
  # Authentication
  api_key: "${EDGE_API_KEY:}"
  jwt_secret: "${JWT_SECRET:}"