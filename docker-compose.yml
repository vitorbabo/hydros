services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hydros-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    networks:
      - hydros
  influxdb:
    image: influxdb:2.7
    container_name: hydros-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin12345
      - DOCKER_INFLUXDB_INIT_ORG=hydros
      - DOCKER_INFLUXDB_INIT_BUCKET=wtp
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=hydros-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - hydros

  telegraf:
    image: telegraf:1.30
    container_name: hydros-telegraf
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - INFLUX_TOKEN=hydros-token
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped
    networks:
      - hydros

  plc-sim:
    build: ./plc-sim
    container_name: hydros-plc-sim
    environment:
      - SITE_ID=wtp-porto-01
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - hydros

  dashboard:
    build: ./dashboard
    container_name: hydros-dashboard
    ports:
      - "5173:5173"
    environment:
      - VITE_MQTT_PORT=9001
    depends_on:
      - mosquitto
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - hydros

networks:
  hydros: {}

volumes:
  influxdb-data: {}


